<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Web App — App shell</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="prototype-utils.css">
<style>
  .shell { min-height: 100vh; display: flex; flex-direction: column; }
  .shell-header { border-bottom: var(--border-width) solid var(--color-border); background: var(--color-bg); }
  .shell-bar {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-2);
    width: 100%; max-width: var(--size-shell-max); margin: 0 auto; padding: var(--space-2) var(--space-3);
  }
  .shell-brand { font-size: var(--font-size-lg); font-weight: var(--font-weight-semibold); color: var(--color-fg); text-decoration: none; }
  .shell-nav { display: none; flex-direction: column; width: 100%; gap: var(--space-1); }
  .shell-menu-btn[aria-expanded="true"] + .shell-nav, .shell-nav.is-open { display: flex; }
  .shell-nav a {
    display: flex; align-items: center; min-height: var(--size-control); padding: 0 var(--space-3);
    border-radius: var(--radius-md); color: var(--color-fg); text-decoration: none; font-weight: var(--font-weight-medium);
  }
  .shell-nav a:hover { background: var(--color-bg-subtle); }
  .shell-nav a[aria-current="page"] { color: var(--color-primary); background: var(--color-bg-subtle); }
  .shell-nav a:focus-visible { outline: var(--border-width-strong) solid var(--color-focus); outline-offset: var(--size-focus-offset); }
  .shell-main { flex: 1; width: 100%; max-width: var(--size-shell-max); margin: 0 auto; padding: var(--space-4) var(--space-3); }
  .shell-footer { border-top: var(--border-width) solid var(--color-border); color: var(--color-fg-muted); font-size: var(--font-size-sm); }
  .shell-footer > div { max-width: var(--size-shell-max); margin: 0 auto; padding: var(--space-3); }
  /* Breakpoint literal: custom properties cannot be used in media queries */
  @media (min-width: 768px) {
    .shell-menu-btn { display: none; }
    .shell-nav { display: flex; flex-direction: row; width: auto; }
  }
</style>
</head>
<body>
<div class="shell" data-arc-shell>
  <header class="shell-header">
    <div class="shell-bar">
      <a class="shell-brand" href="#">Web App</a>
      <button class="btn btn-secondary btn-sm shell-menu-btn" type="button" data-toggle="main-nav" aria-controls="main-nav" aria-expanded="false">Menu</button>
      <nav class="shell-nav" id="main-nav" aria-label="Main">
        <a href="#" data-nav-key="home">Home</a>
      </nav>
    </div>
  </header>
  <main class="shell-main"><div data-arc-content></div></main>
  <footer class="shell-footer"><div>Web App</div></footer>
</div>
</body>
</html>
